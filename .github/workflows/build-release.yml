name: Build kkFileView 5.0.2

on:
  workflow_dispatch: # 支持在 GitHub 网页上手动点击按钮触发构建

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: 'v5.0.2' # 指定拉取官方 5.0.2 版本的代码

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: |
          mvn clean package -DskipTests

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kkFileView-5.0.2-binaries
          path: |
            server/target/*.tar.gz
            server/target/*.zip
          if-no-files-found: error
